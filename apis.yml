aid: shippers-group
name: The Shippers Group
description: >-
  The Shippers Group is a leading national third-party logistics (3PL) company
  headquartered in Dallas, Texas. Founded in 1901, the company provides warehousing,
  co-packaging, fulfillment, and transportation management services across 12 locations
  totaling over 5 million square feet of space. The Shippers Group serves brand leaders
  and market innovators in industries including food, consumer packaged goods, and retail.
  The company was acquired by Kenco Group in December 2023.
